name: CI/CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    name: Modal Deployment
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/dev' && 'kernelbotdev' || '' }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      # Set to 0 for rollback; ordinary submissions use the shared cache automatically.
      KERNELBOT_NVCC_TOOLCHAIN: ${{ vars.KERNELBOT_NVCC_TOOLCHAIN || '1' }}
      KERNELBOT_NVCC_PCH: ${{ vars.KERNELBOT_NVCC_PCH || '1' }}
      KERNELBOT_NVCC_PCH_PROFILES: ${{ vars.KERNELBOT_NVCC_PCH_PROFILES }}
      KERNELBOT_NVCC_TOOLCHAIN_VOLUME: ${{ vars.KERNELBOT_NVCC_TOOLCHAIN_VOLUME || 'kernelbot-nvcc-toolchains' }}
      KERNELBOT_NVCC_PCH_VOLUME: ${{ vars.KERNELBOT_NVCC_PCH_VOLUME || 'kernelbot-nvcc-pch' }}
      KERNELBOT_PCH_VOLUME: ${{ vars.KERNELBOT_PCH_VOLUME || 'kernelbot-torch-pch' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install "modal>=1.5.0"

      - name: Warm Torch header cache
        run: |
          PYTHONPATH=${{ github.workspace }}/src:${{ github.workspace }}/src/runners modal run src/runners/modal_runner.py::warm_pch

      - name: Warm NVCC framework header cache
        if: env.KERNELBOT_NVCC_TOOLCHAIN == '1'
        run: |
          PYTHONPATH=${{ github.workspace }}/src:${{ github.workspace }}/src/runners modal run src/runners/modal_runner.py::warm_nvcc_pch --profiles "$KERNELBOT_NVCC_PCH_PROFILES"

      - name: Deploy job
        run: |
          # TODO: Remove pythonpath here
          PYTHONPATH=${{ github.workspace }}/src:${{ github.workspace }}/src/runners modal deploy src/runners/modal_runner_archs.py
